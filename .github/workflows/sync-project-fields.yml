name: Sync Issue fields to Projects

on:
  issues:
    types: [opened, edited]

permissions:
  issues: read
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync issue template fields to Projects
        uses: actions/github-script@v7
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            if (!process.env.PROJECTS_TOKEN) {
              core.setFailed(
                'PROJECTS_TOKEN が未設定です。docs/PROJECT_SYNC_SETUP.md を参照して PAT を登録してください。'
              );
              return;
            }
            const fs = require('fs');
            const path = require('path');
            const { syncIssueToProject, findSyncConfig } = await import(
              path.join(process.env.GITHUB_WORKSPACE, '.github/scripts/sync-project-fields.mjs')
            );

            const issue = context.payload.issue;
            const allConfig = JSON.parse(
              fs.readFileSync('.github/project-sync-config.json', 'utf8')
            );
            const config = findSyncConfig(allConfig, issue.labels);

            if (!config) {
              core.info('Skip: 大タスク / 小タスク ラベルなし');
              return;
            }

            const [owner, repo] = context.payload.repository.full_name.split('/');
            const updates = await syncIssueToProject({
              graphql: github.graphql,
              config: { projectId: allConfig.projectId, ...config },
              owner,
              repo,
              issueNumber: issue.number,
              issueBody: issue.body ?? '',
            });

            if (updates.length === 0) {
              core.warning('No project fields were updated. Check issue body format.');
            } else {
              core.info(`Updated (${config.triggerLabel}): ${updates.join(', ')}`);
            }
