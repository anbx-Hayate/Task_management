name: "中タスク"
description: "大タスクを成果物単位に分解する（親 Issue から Sub-Issue として作成）"
title: "[中タスク] "
labels: ["中タスク"]
body:
  - type: markdown
    attributes:
      value: |
        ## 中タスク作成ガイド

        大タスクを **成果物単位** に分解するテンプレートです。

        ### 作成手順
        1. **親の大タスク Issue** を開く
        2. **「Create sub-issue」** からこのテンプレートを選ぶ
        3. 成果物の定義を記入する
        4. Projects で `タスク階層=中タスク`・`Status=未着手` を設定する

  - type: textarea
    id: deliverable
    attributes:
      label: "成果物の定義（必須）"
      description: 1文で「何を作るか」を書く
      placeholder: "例：プレゼン資料の構成案 / 学習内容の整理メモ"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "作成後に確認すること"
      options:
        - label: "親の大タスクから Sub-Issue として作成した"
          required: false
        - label: "Projects の「タスク階層」を「中タスク」に設定した"
          required: false
